[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-ai-assessment-workbench"
version = "0.1.0"
description = "Django workflow for evidence-based Trustworthy AI self-assessments"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3"]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["assessments*", "config*"]

[tool.setuptools.package-data]
assessments = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Django owns generated migration class attributes; application code remains fully linted.
"assessments/migrations/*.py" = ["RUF012"]

[tool.coverage.run]
source = ["assessments"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
