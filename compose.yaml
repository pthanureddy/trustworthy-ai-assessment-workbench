services:
  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
             python manage.py seed_framework &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_DB_PATH: /app/data-volume/db.sqlite3
    volumes:
      - assessment_data:/app/data-volume

volumes:
  assessment_data:
